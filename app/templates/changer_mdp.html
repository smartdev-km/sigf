{% extends "base.html" %}
{% block title %}Mot de passe{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <h1 class="h4 mb-3">Changer le mot de passe</h1>
  {% if current_user.doit_changer_mdp %}
    <div class="alert alert-warning">Vous devez définir un nouveau mot de passe avant de continuer.</div>
  {% endif %}
  <div class="card"><div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Ancien mot de passe</label>
        <input class="form-control" type="password" name="ancien" autocomplete="current-password" required></div>
      <div class="mb-3"><label class="form-label">Nouveau mot de passe</label>
        <input class="form-control" type="password" name="nouveau" autocomplete="new-password" minlength="{{ minimum }}" required>
        <div class="form-text">Au moins {{ minimum }} caractères.</div></div>
      <div class="mb-3"><label class="form-label">Confirmation</label>
        <input class="form-control" type="password" name="confirmation" autocomplete="new-password" required></div>
      <button class="btn btn-primary">Enregistrer</button>
    </form>
  </div></div>
</div></div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Erreur {{ code }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-4 text-muted">{{ code }}</div>
  <p class="lead">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}">Retour</a>
</div>
{% endblock %}

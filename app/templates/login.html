{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div class="fs-1 text-primary"><i class="bi bi-geo-alt-fill"></i></div>
      <h1 class="h4">SIGF</h1>
      <p class="text-muted">Système Intégré de Gestion Foncière</p>
    </div>
    <div class="card"><div class="card-body p-4">
      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="username">Identifiant</label>
          <input class="form-control" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Mot de passe</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100">Se connecter</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
